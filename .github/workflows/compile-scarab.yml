name: Compile PR in Container

############################################################
# Triggers
############################################################
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # Allows manual triggering of the workflow to test before merging


############################################################
# Global variables
############################################################
env:
  # SHA of the code being tested (PR head or merge commit)
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}


############################################################
# Jobs
############################################################
jobs:
  build-and-run-scarab-dbg:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/scarab-sim.yml
    with:
      sci_id: top_simpoint_dbg
      collect_metrics: true
      # The merge commit, which exists in this repo even for fork PRs.
      scarab_ref: ${{ github.sha }}

  build-and-run-scarab-opt:
    if: github.event_name == 'pull_request' || github.repository == 'litz-lab/scarab'
    uses: ./.github/workflows/scarab-sim.yml
    with:
      sci_id: top_simpoint
      collect_metrics: true
      run_lint: true
      scarab_ref: ${{ github.sha }}

  compare-ipc:
    ########################################################
    # Job: ensure opt and dbg IPC match
    ########################################################
    if: github.event_name == 'pull_request'
    needs: [build-and-run-scarab-opt, build-and-run-scarab-dbg]
    runs-on: ubuntu-latest
    steps:
      - name: Compare IPC values
        run: |
          opt_ipc="${{ needs.build-and-run-scarab-opt.outputs.ipc }}"
          dbg_ipc="${{ needs.build-and-run-scarab-dbg.outputs.ipc }}"
          if [ -z "$opt_ipc" ] || [ -z "$dbg_ipc" ]; then
            echo "Missing IPC outputs: opt='$opt_ipc' dbg='$dbg_ipc'"
            exit 1
          fi
          if [ "$opt_ipc" != "$dbg_ipc" ]; then
            echo "IPC mismatch: opt=$opt_ipc dbg=$dbg_ipc"
            exit 1
          fi
          echo "IPC match: $opt_ipc"

  perf-report:
    ########################################################
    # Job: publish metrics for the commenting workflow
    #
    # This job must NOT try to comment on the PR itself. For a pull_request
    # event raised from a fork, GitHub forces GITHUB_TOKEN to read-only no
    # matter what `permissions:` declares, so issues.createComment returns
    # 403 "Resource not accessible by integration" and the whole workflow
    # fails -- which is what happened on #551.
    #
    # Instead we write the numbers to an artifact. The companion workflow
    # comment-perf.yml picks it up on workflow_run, where it runs in the base
    # repository's context and does get a writable token.
    ########################################################
    if: github.event_name == 'pull_request'
    needs: [build-and-run-scarab-opt, build-and-run-scarab-dbg, compare-ipc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: litz-lab/scarab_perf
          path: baseline

      - name: Collect metrics
        env:
          SIM_IPC: ${{ needs.build-and-run-scarab-opt.outputs.ipc }}
          SIM_KIPS: ${{ needs.build-and-run-scarab-opt.outputs.kips }}
          SIM_INSTRUCTIONS: ${{ needs.build-and-run-scarab-opt.outputs.instructions }}
        run: |
          last=$(tail -n1 baseline/scarab_perf.log | tr -d '\r')
          # Lines written before the instruction count existed have three
          # fields, so BASE_INSTRUCTIONS just comes out empty for those.
          IFS=',' read -r _ BASE_IPC BASE_KIPS BASE_INSTRUCTIONS <<<"$last"
          mkdir -p perf-report
          # Plain key=value so the consumer can parse it without eval. The PR
          # number is deliberately NOT written here: the consumer resolves it
          # from the workflow_run head SHA so that a fork cannot point the
          # comment at a different PR.
          {
            echo "sim_ipc=${SIM_IPC}"
            echo "sim_kips=${SIM_KIPS}"
            echo "sim_instructions=${SIM_INSTRUCTIONS}"
            echo "base_ipc=${BASE_IPC}"
            echo "base_kips=${BASE_KIPS}"
            echo "base_instructions=${BASE_INSTRUCTIONS}"
          } > perf-report/metrics.txt
          cat perf-report/metrics.txt

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-report/
          retention-days: 7

  update-baseline:
    ########################################################
    # Job: update perf baseline on push
    ########################################################
    if: github.event_name == 'push'
    needs: [build-and-run-scarab-opt]
    runs-on: ubuntu-latest
    env:
      PAT: ${{ secrets.SCARAB_PERF_PAT }}

    steps:
      # 1) Clone the perf repo (via HTTPS + PAT)
      - name: Checkout perf baseline
        uses: actions/checkout@v5
        with:
          repository: litz-lab/scarab_perf
          token: ${{ secrets.SCARAB_PERF_PAT }}
          path: perf

      # 2) Ensure commits come from the GH‑actions bot
      - name: Configure Git user
        run: |
          cd perf
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 3) “Force Authentication” remote add/set‑url exactly like your sync job
      - name: Force Authentication with Fine-Grained PAT
        run: |
          cd perf
          if git remote get-url public > /dev/null 2>&1; then
            git remote set-url public https://${PAT}@github.com/litz-lab/scarab_perf.git
          else
            git remote add public https://${PAT}@github.com/litz-lab/scarab_perf.git
          fi
          git credential reject https://github.com/ || true

      # 4) Append the new line
      - name: Append new metrics line
        run: |
          echo "${COMMIT_SHA},${{ needs.build-and-run-scarab-opt.outputs.ipc }},${{ needs.build-and-run-scarab-opt.outputs.kips }},${{ needs.build-and-run-scarab-opt.outputs.instructions }}" \
            >> perf/scarab_perf.log

      # 5) Commit & push back to the perf repo using the “public” remote
      - name: Commit & Push perf update
        run: |
          cd perf
          git add scarab_perf.log
          git commit -m "Add perf result for ${COMMIT_SHA}"
          git push public main
